version: 2
updates:
- package-ecosystem: npm
  directories:
  - /
  schedule:
    interval: daily
    time: '05:00'
    timezone: Asia/Tokyo
  # Keep Node types aligned with the Node 22 runtime baseline; minor/patch updates remain enabled.
  ignore:
  - dependency-name: "@types/node"
    update-types: ["version-update:semver-major"]
  open-pull-requests-limit: 10
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: cargo
  directories:
  - /
  schedule:
    interval: daily
    time: '05:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 10
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: pip
  directories:
